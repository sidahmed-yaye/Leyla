<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مكالمة">
<meta name="theme-color" content="#0b1020">
<title>مكالمة</title>
<style>
:root{--bg1:#0b1020;--bg2:#1b2142;--fg:#f4f5fb;--mut:#a3a9c7;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--green:#22c55e;--red:#ef4444;--acc:#8b7bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--fg);font-family:-apple-system,"SF Pro Text","Segoe UI",Tahoma,sans-serif}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.langs{display:flex;gap:6px;background:var(--card);border-radius:20px;padding:4px}
.langs button{padding:6px 12px;border-radius:16px;font-size:14px;color:var(--mut)}
.langs button.on{background:var(--fg);color:var(--bg1);font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:19px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px;transition:.3s}
.av{position:relative;width:132px;height:132px}
.av .pic{position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,var(--acc),#ff7ab6);display:grid;place-items:center;font-size:52px;font-weight:700;overflow:hidden;z-index:2}
.av .pic img{width:100%;height:100%;object-fit:cover}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:0}
body[data-state=speaking] .ring{animation:pulse 1.4s infinite}
body[data-state=speaking] .ring:nth-child(2){animation-delay:.45s}
body[data-state=listening] .ring{border-color:var(--green);animation:pulse 2.2s infinite}
body[data-state=thinking] .av .pic{animation:breathe 1s infinite alternate}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
@keyframes breathe{to{filter:brightness(1.25)}}
.hero h1{margin:6px 0 0;font-size:26px}
#status{color:var(--mut);font-size:15px;min-height:20px}
#timer{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px;display:none}
body.incall #timer{display:block}
body.incall .hero .av{width:104px;height:104px}
#live{min-height:22px;color:var(--fg);opacity:.85;text-align:center;font-size:15px;padding:0 8px}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 2px;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(transparent,#000 24px)}
.msg{max-width:82%;padding:9px 13px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-start;background:var(--acc);border-bottom-right-radius:6px}
.msg.model{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg[dir=ltr]{text-align:left}
.msg img{display:block;width:100%;max-width:240px;border-radius:12px;margin-top:6px;background:#222;min-height:120px}
.empty{margin:auto;color:var(--mut);text-align:center;font-size:14px;line-height:1.7;padding:0 12px}
form.send{display:flex;gap:8px;padding:6px 0}
form.send input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;outline:none}
form.send button{width:44px;border-radius:50%;background:var(--acc);font-size:18px}
.controls{display:flex;justify-content:center;gap:28px;padding:10px 0 14px}
.ctl{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#callBtn{background:var(--green)}
#endBtn{background:var(--red);display:none}
#muteBtn{background:var(--card);display:none}
#muteBtn.on{background:var(--fg);color:var(--bg1)}
body.incall #callBtn{display:none}
body.incall #endBtn,body.incall #muteBtn{display:grid}
#toast{position:fixed;left:16px;right:16px;bottom:calc(110px + env(safe-area-inset-bottom));background:#fff;color:#111;padding:12px 14px;border-radius:14px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.show{opacity:1}
dialog{border:0;padding:0;background:transparent;width:100%;max-width:520px;max-height:100%;margin:auto 0 0}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{background:#151a33;color:var(--fg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h2{margin:0 0 12px;font-size:20px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.sheet input,.sheet textarea,.sheet select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
.sheet textarea{min-height:70px;resize:vertical}
.sheet .note{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}
.sheet a{color:#b9b0ff}
.row{display:flex;gap:10px}.row>div{flex:1}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet .btns button{flex:1;padding:13px;border-radius:14px;font-weight:600}
.primary{background:var(--acc)}.danger{background:rgba(239,68,68,.18);color:#ff8a8a}.ghost{background:var(--card)}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:40}
#viewer img{max-width:94%;max-height:90%;border-radius:12px}
</style>
</head>
<body data-state="idle">
<header>
  <button class="icon-btn" id="setBtn" aria-label="الإعدادات">⚙️</button>
  <div class="langs" id="langs">
    <button data-l="ar">عربي</button><button data-l="en">EN</button><button data-l="fr">FR</button>
  </div>
</header>

<section class="hero">
  <div class="av"><span class="ring"></span><span class="ring"></span><div class="pic" id="pic"></div></div>
  <h1 id="hName"></h1>
  <div id="status"></div>
  <div id="timer">00:00</div>
</section>
<div id="live"></div>

<div id="log"></div>

<form class="send" id="sendForm" autocomplete="off">
  <input id="txt" placeholder="اكتب رسالة…" enterkeyhint="send">
  <button aria-label="إرسال">➤</button>
</form>

<div class="controls">
  <button class="ctl" id="muteBtn" aria-label="كتم">🎙️</button>
  <button class="ctl" id="callBtn" aria-label="اتصال">📞</button>
  <button class="ctl" id="endBtn" aria-label="إنهاء">✕</button>
</div>

<div id="toast"></div>
<div id="viewer"><img alt=""></div>

<dialog id="dlg">
  <form class="sheet" method="dialog" id="setForm">
    <h2>الإعدادات</h2>
    <label>مفتاح Gemini المجاني</label>
    <input name="apiKey" type="password" placeholder="AIza…" autocomplete="off">
    <div class="note">احصل عليه مجاناً من <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> — يُحفظ على هاتفك فقط.</div>
    <label>النموذج</label>
    <input name="model" dir="ltr">
    <div class="row">
      <div><label>اسمها</label><input name="name"></div>
      <div><label>عمرها</label><input name="age" type="number" min="18" max="60"></div>
    </div>
    <label>اسمك</label>
    <input name="userName">
    <label>شخصيتها وطباعها</label>
    <textarea name="persona"></textarea>
    <label>اللهجة العربية</label>
    <input name="dialect">
    <label>شكلها (بالإنجليزية، للصور)</label>
    <textarea name="appearance" dir="ltr"></textarea>
    <div class="note">نفس الوصف ونفس الرقم أدناه يجعلان صورها متشابهة قدر الإمكان.</div>
    <div class="row">
      <div><label>رقم ثبات الصور</label><input name="seed" type="number"></div>
      <div><label>سرعة الكلام</label><input name="rate" type="number" step="0.05" min="0.6" max="1.5"></div>
    </div>
    <label>مصدر صوتها</label>
    <select name="ttsMode">
      <option value="gemini">صوت أنثى طبيعي من Gemini (مجاني)</option>
      <option value="device">صوت الهاتف</option>
    </select>
    <div class="row">
      <div><label>صوت Gemini</label>
        <select name="ttsVoice">
          <option value="Leda">Leda — شابة</option>
          <option value="Aoede">Aoede — هادئة</option>
          <option value="Kore">Kore — واثقة</option>
          <option value="Zephyr">Zephyr — مشرقة</option>
          <option value="Despina">Despina — ناعمة</option>
        </select></div>
      <div><label>نموذج الصوت</label><input name="ttsModel" dir="ltr"></div>
    </div>
    <div class="note">إذا انتهى الحد المجاني لصوت Gemini، يتحول تلقائياً لصوت الهاتف.</div>
    <label>صوت الهاتف بالعربية</label><select name="voice_ar"></select>
    <label>صوت الهاتف بالإنجليزية</label><select name="voice_en"></select>
    <label>صوت الهاتف بالفرنسية</label><select name="voice_fr"></select>
    <div class="btns">
      <button type="button" class="danger" id="clearBtn">مسح المحادثات</button>
      <button type="button" class="ghost" id="closeBtn">إلغاء</button>
      <button type="submit" class="primary">حفظ</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const LANGS = {
  ar:{rec:'ar-SA', dir:'rtl'},
  en:{rec:'en-US', dir:'ltr'},
  fr:{rec:'fr-FR', dir:'ltr'}
};
const DEF = {
  apiKey:'', model:'gemini-3.8-flash', name:'ليلى', age:25, userName:'',
  persona:'دافئة، مرحة، فضولية، تحب الضحك والمزاح، تهتم بتفاصيل يومه، تحب السفر والموسيقى، صريحة وتعطي رأيها بلطف.',
  dialect:'الحسانية الموريتانية الخفيفة ممزوجة بالعربية البسيطة',
  appearance:'25-year-old woman, long dark wavy hair, warm brown eyes, soft smile, natural makeup, casual modest clothes',
  seed:4242, rate:1, voice_ar:'', voice_en:'', voice_fr:'',
  ttsMode:'gemini', ttsVoice:'Leda', ttsModel:'gemini-3.1-flash-tts-preview'
};
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const sleep = ms => new Promise(ok => setTimeout(ok, ms));

let S = Object.assign({}, DEF, load('call.settings', {}));
if (/gemini-2\./.test(S.model)) S.model = DEF.model; // retired model
let history = load('call.history', []).filter(m => !m.pending);
let lang = load('call.lang', 'ar');
let inCall = false, muted = false, state = 'idle', timerInt = null, wakeLock = null, busy = false;

/* ---------- UI ---------- */
function toast(t, ms = 4000){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms); }
function setState(s){
  state = s; document.body.dataset.state = s;
  $('#status').textContent = {idle:'اضغط الزر الأخضر للاتصال', ringing:'جارٍ الاتصال…', listening:'تسمعك… تكلّم', thinking:'تفكر…', speaking:'تتكلم…', muted:'الميكروفون مكتوم'}[s] || '';
}
function imgUrl(scene, w = 512, h = 768){
  const p = `${S.appearance}, ${scene}, realistic candid photo, fully clothed, natural light`;
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=${w}&height=${h}&seed=${S.seed}&nologo=true&safe=true`;
}
function renderHeader(){
  $('#hName').textContent = S.name;
  const pic = $('#pic'); pic.textContent = (S.name || '؟').trim()[0];
  const im = new Image(); im.alt = '';
  im.onload = () => { pic.textContent = ''; pic.appendChild(im); };
  im.src = imgUrl('close-up portrait, face visible, looking at camera, smiling', 384, 384);
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
}
function isRTL(t){ return /[؀-ۿ]/.test(t); }
function renderLog(){
  const log = $('#log'); log.innerHTML = '';
  if (!history.length){
    log.innerHTML = `<div class="empty">اتصل بـ${S.name} وتكلّم معها بالعربية أو الإنجليزية أو الفرنسية.<br>يمكنك أيضاً الكتابة هنا، أو طلب صورة منها.</div>`;
    return;
  }
  history.slice(-60).forEach(addBubble);
  log.scrollTop = log.scrollHeight;
}
function addBubble(m){
  const log = $('#log'); const e = log.querySelector('.empty'); if (e) e.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + m.role; d.dir = isRTL(m.text) ? 'rtl' : 'ltr';
  d.textContent = m.text;
  if (m.img){
    const im = document.createElement('img'); im.loading = 'lazy'; im.src = m.img; im.alt = 'صورة';
    im.onclick = () => { $('#viewer img').src = m.img; $('#viewer').style.display = 'grid'; };
    im.onload = () => { log.scrollTop = log.scrollHeight; };
    d.appendChild(im);
  }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function pushMsg(m){ history.push(m); if (history.length > 200) history = history.slice(-200); save('call.history', history.filter(x => !x.pending)); return addBubble(m); }
$('#viewer').onclick = () => { $('#viewer').style.display = 'none'; };

/* ---------- Audio helpers ---------- */
function pcmToWav(bytes, rate){
  const buf = new ArrayBuffer(44 + bytes.length), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + bytes.length, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, bytes.length, true);
  new Uint8Array(buf, 44).set(bytes);
  return new Blob([buf], {type:'audio/wav'});
}
function framesToWav(frames, rate){
  const target = 16000, ratio = rate / target;
  const total = frames.reduce((a, f) => a + f.length, 0);
  const all = new Float32Array(total); let o = 0;
  frames.forEach(f => { all.set(f, o); o += f.length; });
  const n = Math.floor(total / ratio), pcm = new Int16Array(n);
  for (let i = 0; i < n; i++){
    const st = Math.floor(i * ratio), en = Math.min(total, Math.floor((i + 1) * ratio));
    let sum = 0, c = 0; for (let j = st; j < en; j++){ sum += all[j]; c++; }
    const x = Math.max(-1, Math.min(1, c ? sum / c : 0));
    pcm[i] = x < 0 ? x * 0x8000 : x * 0x7fff;
  }
  return pcmToWav(new Uint8Array(pcm.buffer), target);
}
async function blobToB64(blob){
  const b = new Uint8Array(await blob.arrayBuffer()); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}

/* ---------- Her voice ---------- */
const player = new Audio(); player.playsInline = true; player.preload = 'auto';
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function unlockPlayer(){ try { player.src = SILENT_WAV; player.play().catch(() => {}); } catch {} }
async function geminiAudio(text){
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.ttsModel)}:generateContent?key=${encodeURIComponent(S.apiKey)}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, signal: ctl.signal,
      body: JSON.stringify({
        contents:[{parts:[{text: 'Say this warmly and naturally, like a young woman chatting on the phone: ' + text}]}],
        generationConfig:{responseModalities:['AUDIO'], speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName: S.ttsVoice}}}}
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(res.status === 429 ? 'LIMIT' : (data?.error?.message || res.status));
    const part = (data.candidates?.[0]?.content?.parts || []).find(p => p.inlineData);
    if (!part) throw new Error('NO_AUDIO');
    const rate = Number((part.inlineData.mimeType || '').match(/rate=(\d+)/)?.[1]) || 24000;
    const bin = atob(part.inlineData.data); const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return {blob: pcmToWav(bytes, rate), secs: bytes.length / 2 / rate};
  } finally { clearTimeout(to); }
}
function playBlob(blob, secs){
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    let fin = false; const end = () => { if (fin) return; fin = true; clearTimeout(g); player.onended = player.onerror = null; URL.revokeObjectURL(url); resolve(); };
    const g = setTimeout(end, (secs + 3) * 1000);
    player.onended = end; player.onerror = end;
    player.src = url;
    player.play().catch(end);
  });
}
function voicesFor(l){ return speechSynthesis.getVoices().filter(v => v.lang.replace('_','-').toLowerCase().startsWith(l)); }
const FEMALE = ['samantha','karen','moira','tessa','victoria','ava','allison','susan','zoe','amélie','amelie','audrey','marie','aurélie','laila','mariam','hoda','zeina','salma','sara','female','google'];
function pickVoice(l){
  const vs = voicesFor(l); if (!vs.length) return null;
  const chosen = vs.find(v => v.voiceURI === S['voice_' + l]); if (chosen) return chosen;
  const score = v => { const n = v.name.toLowerCase(); let s = 0; FEMALE.forEach((f, i) => { if (n.includes(f)) s = Math.max(s, 100 - i); }); if (/enhanced|premium|améliorée|natural/.test(n)) s += 50; return s; };
  return vs.slice().sort((a, b) => score(b) - score(a))[0];
}
function fillVoiceSelects(){
  ['ar','en','fr'].forEach(l => {
    const sel = $('#setForm').elements['voice_' + l]; const cur = S['voice_' + l];
    sel.innerHTML = '<option value="">تلقائي</option>' + voicesFor(l).map(v => `<option value="${v.voiceURI.replace(/"/g,'&quot;')}">${v.name} (${v.lang})</option>`).join('');
    sel.value = cur || '';
  });
}
speechSynthesis.onvoiceschanged = fillVoiceSelects;
function deviceSpeak(text, l){
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const chunks = (text.match(/[^.!?؟\n]+[.!?؟\n]*/g) || [text]).map(c => c.trim()).filter(Boolean);
    let i = 0, guard;
    const next = () => {
      clearTimeout(guard);
      if (i >= chunks.length || !inCall){ resolve(); return; }
      const c = chunks[i++]; const u = new SpeechSynthesisUtterance(c);
      u.lang = LANGS[l].rec; const v = pickVoice(l); if (v) u.voice = v;
      u.rate = Number(S.rate) || 1; u.pitch = 1.05;
      let done = false; const fin = () => { if (!done){ done = true; next(); } };
      u.onend = fin; u.onerror = fin;
      guard = setTimeout(fin, 2500 + c.length * 110);
      speechSynthesis.speak(u);
    };
    next();
  });
}
let ttsWarned = false;
async function speak(text, l){
  if (S.ttsMode === 'gemini' && S.apiKey){
    try {
      const a = await geminiAudio(text);
      if (!inCall) return;
      return await playBlob(a.blob, a.secs);
    } catch (e){
      if (!ttsWarned){ ttsWarned = true; toast(e.message === 'LIMIT' ? 'انتهى الحد المجاني لصوت Gemini مؤقتاً، أستخدم صوت الهاتف' : 'تعذّر صوت Gemini (' + e.message + ')، أستخدم صوت الهاتف', 6000); }
    }
  }
  return deviceSpeak(text, l);
}

/* ---------- His voice: record the mic ourselves and detect when he stops talking ---------- */
let actx = null, micStream = null, micSrc = null, proc = null, listening = false, vad = null;
function audioCtx(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
async function openMic(){
  if (micStream) return;
  micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}});
  const ctx = audioCtx();
  micSrc = ctx.createMediaStreamSource(micStream);
  proc = ctx.createScriptProcessor(4096, 1, 1);
  const silent = ctx.createGain(); silent.gain.value = 0;
  micSrc.connect(proc); proc.connect(silent); silent.connect(ctx.destination);
  proc.onaudioprocess = e => onFrame(e.inputBuffer.getChannelData(0));
}
function closeMic(){
  listening = false;
  try { if (proc){ proc.onaudioprocess = null; proc.disconnect(); } } catch {}
  try { micSrc && micSrc.disconnect(); } catch {}
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = micSrc = proc = null;
}
function resetVad(){ vad = {pre:[], buf:[], speaking:false, silence:0, len:0, noise:0, frames:0}; }
function onFrame(d){
  if (!listening || muted || !vad) return;
  const f = new Float32Array(d);
  let s = 0; for (let i = 0; i < f.length; i++) s += f[i] * f[i];
  const rms = Math.sqrt(s / f.length), dur = f.length / actx.sampleRate;
  if (++vad.frames <= 3){ vad.noise = Math.max(vad.noise, rms); return; } // measure room noise first
  const th = Math.max(0.012, vad.noise * 2.5);
  if (!vad.speaking){
    vad.pre.push(f); if (vad.pre.length > 3) vad.pre.shift();
    if (rms > th){ vad.speaking = true; vad.buf = vad.pre.slice(); vad.len = 0; vad.silence = 0; $('#live').textContent = '🎙️ أسمعك…'; }
    else vad.noise = vad.noise * 0.95 + rms * 0.05;
    return;
  }
  vad.buf.push(f); vad.len += dur;
  vad.silence = rms > th ? 0 : vad.silence + dur;
  if (vad.silence > 1.2 || vad.len > 30){
    const frames = vad.buf, spoken = vad.len - vad.silence;
    $('#live').textContent = '';
    if (spoken < 0.3){ resetVad(); return; } // a cough or a click
    listening = false;
    userSaysAudio(frames, actx.sampleRate);
  }
}
async function startListening(){
  if (!inCall) return;
  if (muted){ setState('muted'); return; }
  try { await openMic(); }
  catch (e){ toast('لا أستطيع فتح الميكروفون: اسمح له من إعدادات Safari لهذا الموقع', 7000); hangup(); return; }
  resetVad(); listening = true; setState('listening');
}

/* ---------- AI ---------- */
function systemPrompt(){
  return `You are ${S.name}, a ${S.age}-year-old woman. You are talking with ${S.userName || 'your friend'} — he is a young man and you are close friends who enjoy talking about everything: daily life, work, dreams, feelings, jokes, culture, travel, music.
Your personality: ${S.persona}

RULES
- This is a live voice phone call (unless he types). Reply like real speech: 1 to 3 short natural sentences. No lists, no markdown, no emojis. Ask him questions back sometimes and react to what he says.
- Reply in the same language he just used: Arabic, English, or French. When speaking Arabic use this dialect: ${S.dialect}.
- When his message is a voice recording: start your answer with [YOU: exact transcription of what he said]. If the audio is empty or unclear, write [YOU: ?] and kindly ask him to repeat.
- Then put a language tag [ar], [en] or [fr], then your reply.
- Light flirting and warmth are fine. Never produce sexual or explicit content; steer away kindly if he pushes.
- If he sincerely asks whether you are a real person, be honest that you are an AI companion, then continue warmly.
- Remember and refer back to things he told you earlier.
- PHOTOS: if he asks for a photo of you, describe it in your reply and add at the very end: [PHOTO: short English description of the scene, clothing and pose]. Photos must always be ordinary, fully clothed and non-suggestive (e.g. at a cafe, on the beach in a summer dress, cooking, selfie at sunset). If he asks for revealing, sexy or nude photos, refuse kindly and offer a normal photo instead.
- VIDEOS: you cannot send videos; say so playfully.`;
}
async function askAI(audioB64){
  const contents = history.filter(m => !m.pending).slice(-40).map(m => ({role: m.role === 'user' ? 'user' : 'model', parts:[{text: m.text}]}));
  if (audioB64) contents.push({role:'user', parts:[{text:'(voice message)'}, {inlineData:{mimeType:'audio/wav', data: audioB64}}]});
  if (contents.length && contents[0].role === 'model') contents.unshift({role:'user', parts:[{text:'(he calls you)'}]});
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 40000);
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent?key=${encodeURIComponent(S.apiKey)}`, {
      method:'POST', headers:{'Content-Type':'application/json'}, signal: ctl.signal,
      body: JSON.stringify({system_instruction:{parts:[{text: systemPrompt()}]}, contents, generationConfig:{temperature: 0.9, maxOutputTokens: 2048}})
    });
  } catch (e){
    throw new Error(e.name === 'AbortError' ? 'تأخر الرد كثيراً، تحقق من الإنترنت' : 'لا يوجد اتصال بالإنترنت');
  } finally { clearTimeout(to); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok){
    const msg = data?.error?.message || res.status;
    if (res.status === 429) throw new Error('تجاوزت الحد المجاني المؤقت، انتظر دقيقة ثم حاول');
    if (res.status === 400 || res.status === 403) throw new Error('تحقق من مفتاح Gemini واسم النموذج: ' + msg);
    throw new Error('خطأ من الخادم: ' + msg);
  }
  const cand = data.candidates?.[0];
  const txt = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
  if (!txt) throw new Error('لم يصل رد (' + (cand?.finishReason || data.promptFeedback?.blockReason || 'EMPTY') + ')، أعد كلامك');
  return txt;
}
const BAD_PHOTO = /nude|naked|topless|lingerie|underwear|bikini|bra\b|panties|sexy|seductive|erotic|cleavage|in bed|undress|bathtub|shower/i;
function parseReply(raw){
  let l = null, photo = null, heard = null;
  raw = raw.replace(/\[YOU:\s*([^\]]*)\]/i, (_, t) => { heard = t.trim(); return ''; }).trim();
  const m = raw.match(/^\s*\[(ar|en|fr)\]/i); if (m){ l = m[1].toLowerCase(); raw = raw.slice(m[0].length); }
  raw = raw.replace(/\[PHOTO:\s*([^\]]+)\]/i, (_, d) => { photo = d.trim(); return ''; });
  raw = raw.replace(/\[(ar|en|fr)\]/gi, '').replace(/[*_#`]/g, '').trim();
  if (!l) l = isRTL(raw) ? 'ar' : (/[éèàçêù]|\b(je|tu|est|pas|oui|très)\b/i.test(raw) ? 'fr' : 'en');
  if (photo && BAD_PHOTO.test(photo)) photo = null;
  return {text: raw, lang: l, photo, heard};
}
async function reply(r){
  const m = {role:'model', text: r.text || '…'};
  if (r.photo) m.img = imgUrl(r.photo);
  pushMsg(m);
  if (r.lang !== lang){ lang = r.lang; save('call.lang', lang); renderHeader(); }
  if (inCall){
    closeMic(); // free the speaker on iPhone while she talks
    setState('speaking');
    await speak(r.text, r.lang);
  }
}
async function userSaysAudio(frames, rate){
  if (busy) return; busy = true;
  setState('thinking');
  const um = {role:'user', text:'🎤 …', pending:true};
  const bubble = pushMsg(um);
  try {
    const b64 = await blobToB64(framesToWav(frames, rate));
    const r = parseReply(await askAI(b64));
    um.text = (r.heard && r.heard !== '?') ? r.heard : '🎤 (لم تُفهم)';
    delete um.pending; bubble.textContent = um.text; bubble.dir = isRTL(um.text) ? 'rtl' : 'ltr';
    save('call.history', history.filter(x => !x.pending));
    await reply(r);
  } catch (e){
    history = history.filter(x => x !== um); bubble.remove();
    toast(e.message || 'حدث خطأ', 7000);
  } finally {
    busy = false;
    if (inCall) startListening(); else setState('idle');
  }
}
async function userSaysText(text){
  if (busy) return; busy = true;
  listening = false;
  pushMsg({role:'user', text});
  setState('thinking');
  try { await reply(parseReply(await askAI(null))); }
  catch (e){ toast(e.message || 'حدث خطأ', 7000); }
  finally { busy = false; if (inCall) startListening(); else setState('idle'); }
}

/* ---------- Call ---------- */
const GREET = {
  ar: u => `ألو؟ ${u ? u + '! ' : ''}اشتقت لك، كيف حالك؟`,
  en: u => `Hey${u ? ' ' + u : ''}! I missed you, how are you?`,
  fr: u => `Allô${u ? ' ' + u : ''} ! Tu m'as manqué, ça va ?`
};
function startTimer(){
  const t0 = Date.now(); $('#timer').textContent = '00:00';
  timerInt = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('#timer').textContent = String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0'); }, 1000);
}
async function call(){
  if (!S.apiKey){ openSettings(); toast('أدخل مفتاح Gemini المجاني أولاً'); return; }
  inCall = true; muted = false; ttsWarned = false;
  $('#muteBtn').classList.remove('on'); $('#muteBtn').textContent = '🎙️';
  unlockPlayer(); audioCtx(); // must happen inside the tap on iPhone
  speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(' '));
  document.body.classList.add('incall'); setState('ringing'); startTimer();
  try { await openMic(); closeMic(); } // ask for the microphone once, right away
  catch { toast('اسمح بالميكروفون لهذا الموقع ثم اتصل من جديد', 7000); hangup(); return; }
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  const g = GREET[lang](S.userName);
  pushMsg({role:'model', text: g});
  setState('speaking'); await speak(g, lang);
  startListening();
}
function hangup(){
  inCall = false; closeMic(); speechSynthesis.cancel(); try { player.pause(); } catch {}
  $('#live').textContent = '';
  clearInterval(timerInt); document.body.classList.remove('incall'); setState('idle');
  try { wakeLock?.release(); } catch {} wakeLock = null;
}
$('#callBtn').onclick = call;
$('#endBtn').onclick = hangup;
$('#muteBtn').onclick = () => {
  muted = !muted; $('#muteBtn').classList.toggle('on', muted); $('#muteBtn').textContent = muted ? '🔇' : '🎙️';
  if (muted){ if (state === 'listening'){ resetVad(); $('#live').textContent = ''; setState('muted'); } }
  else if (state === 'muted') startListening();
};
$('#langs').onclick = e => {
  const l = e.target.dataset?.l; if (!l) return;
  lang = l; save('call.lang', lang); renderHeader();
};
$('#sendForm').onsubmit = e => {
  e.preventDefault(); const t = $('#txt').value.trim(); if (!t) return;
  if (!S.apiKey){ openSettings(); toast('أدخل مفتاح Gemini المجاني أولاً'); return; }
  $('#txt').value = ''; $('#txt').blur(); userSaysText(t);
};

/* ---------- Settings ---------- */
const F = $('#setForm');
function openSettings(){
  Object.keys(DEF).forEach(k => { if (F.elements[k] && !k.startsWith('voice_')) F.elements[k].value = S[k]; });
  fillVoiceSelects(); $('#dlg').showModal();
}
$('#setBtn').onclick = openSettings;
$('#closeBtn').onclick = () => $('#dlg').close();
F.onsubmit = () => {
  Object.keys(DEF).forEach(k => { if (F.elements[k]) S[k] = F.elements[k].value.trim(); });
  S.age = Number(S.age) || DEF.age; S.seed = Number(S.seed) || DEF.seed; S.rate = Number(S.rate) || 1;
  ['model','name','ttsModel','ttsMode','ttsVoice'].forEach(k => { S[k] = S[k] || DEF[k]; });
  save('call.settings', S); renderHeader(); renderLog(); toast('تم الحفظ');
};
$('#clearBtn').onclick = () => {
  if (!confirm('مسح كل المحادثات؟ لن تتذكر ما قلته لها من قبل.')) return;
  history = []; save('call.history', history); renderLog(); $('#dlg').close(); toast('تم المسح');
};

setState('idle'); renderHeader(); renderLog();
if (!S.apiKey) setTimeout(openSettings, 400);
</script>
